{{- $tag := default .Chart.AppVersion .Values.image.tag }}
{{- $image := printf "%s:%s" .Values.image.repository $tag }}
{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- /* The sweeper is a singleton (advisory lock): one replica, never two pods at once. */ -}}
{{- $components := list "web" "service" "sweeper" }}
{{- range $component := $components }}
{{- $cfg := index $.Values.components $component }}
{{- $labels := dict "context" $ "component" $component }}
{{- $args := dict "web" "serve-web" "service" "serve-service" "sweeper" "sweeper" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-vault.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agents-vault.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if eq $component "sweeper" }}
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ $cfg.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agents-vault.componentLabels" $labels | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agents-vault.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agents-vault.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "agents-vault.serviceAccountName" $ }}
      {{- /* web writes and sweeper deletes Secrets through the API; service never talks to it. */}}
      automountServiceAccountToken: {{ ne $component "service" }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["vault"]
          args: ["migrate"]
          {{- include "agents-vault.env" (dict "ctx" $) | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ $component }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["vault"]
          args: [{{ index $args $component | quote }}]
          {{- include "agents-vault.env" (dict "ctx" $ "tokensFile" (eq $component "service")) | nindent 10 }}
          {{- if ne $component "sweeper" }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $cfg.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $cfg.port }}
          {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $component "service" }}
            - name: service-tokens
              mountPath: /var/run/agents-vault/service-tokens
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $component "service" }}
        - name: service-tokens
          secret:
            secretName: {{ include "agents-vault.serviceTokensSecret" $ }}
            items:
              - key: {{ $.Values.serviceListener.tokensSecret.key | default "tokens" }}
                path: tokens
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
